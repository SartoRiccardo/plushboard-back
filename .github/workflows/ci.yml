name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # dummy values: the suites are offline (temp SQLite + mocked upstreams)
    # but config.py fail-fasts without these
    env:
      SESSION_SECRET: ci-secret
      OAUTH_CLIENT_ID: ci-client
      OAUTH_CLIENT_SECRET: ci-secret
      OAUTH_ALLOWED_EMAILS: ci@example.com
      PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # one process per suite: the MCP session manager is single-use per
      # interpreter, so shared-process collection would double-enter it
      - run: for f in test_*.py; do python -m pytest "$f" -q || exit 1; done

  docker:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$IMAGE:$GITHUB_REF_NAME"
            else
              echo "$IMAGE:latest"
              echo "$IMAGE:$GITHUB_SHA"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
